  /2.3.0/spacecraft/:
    get:
      operationId: spacecraft_list
      summary: List Spacecraft
      description: '#### Modes

        Levels of detail in the response - `normal`, `detailed`


        Example - /spacecraft/?mode=detailed


        #### Filters

        Parameters - `in_space`, `is_placeholder`, `name`, `spacecraft_config`, `status`


        Example - /spacecraft/?is_placeholder=True


        #### Search

        Fields searched - `name`, `spacecraft_config__name`


        Example - /spacecraft/?search=Endeavour


        #### Ordering

        Fields - `flights_count`, `id`, `mission_ends_count`, `time_docked`, `time_in_space`


        Example - /spacecraft/?ordering=-flights_count


        #### Number of results

        Use `limit` to control the number of objects in the response (max 100)


        Example - /spacecraft/?limit=2


        #### Format

        Switch to JSON output - /spacecraft/?format=json


        #### Help

        Find all the FAQs and support links on the documentation homepage - ll.thespacedevs.com/docs'
      parameters:
      - in: query
        name: in_space
        schema:
          type: boolean
      - in: query
        name: is_placeholder
        schema:
          type: boolean
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: mode
        schema:
          type: string
          enum:
          - detailed
          - normal
        description: Level of detail in the response.
      - in: query
        name: name
        schema:
          type: string
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: spacecraft_config
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: integer
      tags:
      - Spacecraft
      security:
      - cookieAuth: []
      - Token_Authentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPolymorphicSpacecraftEndpointList'
          description: ''
