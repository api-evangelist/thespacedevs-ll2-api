openapi: 3.2.0
info:
  title: TheSpaceDevs LL2 Events API
  version: v2.3.0
  description: Rocket launches, space events and crewed spaceflight. The Launch Library 2 API is the official successor of the popular Launch Library API. It keeps its core features whilst also including everything the broader Space Launch Now API had to offer. The result is a large database delivering a more complete experience for each rocket launch and ...
  license:
    name: Apache License 2.0
servers:
- url: https://ll.thespacedevs.com/
  description: Production API (� rate-limited)
- url: https://lldev.thespacedevs.com/
  description: Development API (stale and limited data, for development testing only)
tags:
- name: Events
paths:
  /2.3.0/events/:
    get:
      operationId: events_list
      summary: List Events
      description: '#### Modes

        Levels of detail in the response - `list`, `normal`, `detailed`


        Example - /events/?mode=list


        #### Filters

        Parameters - `agency__ids`, `date__gt`, `date__gt__lt`, `date__gte`, `date__lte`, `day`, `id`, `last_updated__gte`, `last_updated__lte`, `month`, `program`, `slug`, `type`, `type__ids`, `video_url`, `year`


        Example - /events/?type__ids=2,8


        #### Search

        Fields searched - `name`


        Example - /events/?search=Flyby


        #### Ordering

        Fields - `date`, `last_updated`


        Example - /events/?ordering=-last_updated


        #### Number of results

        Use `limit` to control the number of objects in the response (max 100)


        Example - /events/?limit=2


        #### Format

        Switch to JSON output - /events/?format=json


        #### Help

        Find all the FAQs and support links on the documentation homepage - ll.thespacedevs.com/docs'
      parameters:
      - in: query
        name: agency__ids
        schema:
          type: array
          items:
            type: integer
        description: Comma-separated agency IDs.
        explode: false
        style: form
      - in: query
        name: date__gt
        schema:
          type: string
          format: date-time
        description: Date is greater than
      - in: query
        name: date__gt__lt
        schema:
          type: string
          format: date-time
        description: Date is less than
      - in: query
        name: date__gte
        schema:
          type: string
          format: date-time
        description: Date is greater than or equal to
      - in: query
        name: date__lte
        schema:
          type: string
          format: date-time
        description: Date is less than or equal to
      - in: query
        name: day
        schema:
          type: array
          items:
            type: number
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: id
        schema:
          type: array
          items:
            type: integer
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: last_updated__gte
        schema:
          type: string
          format: date-time
        description: Last Update is greater than or equal to
      - in: query
        name: last_updated__lte
        schema:
          type: string
          format: date-time
        description: Last Update is less than or equal to
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: mode
        schema:
          type: string
          enum:
          - detailed
          - list
          - normal
        description: Level of detail in the response.
      - in: query
        name: month
        schema:
          type: array
          items:
            type: number
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: program
        schema:
          type: array
          items:
            type: integer
        explode: true
        style: form
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: slug
        schema:
          type: string
      - in: query
        name: type
        schema:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
      - in: query
        name: type__ids
        schema:
          type: array
          items:
            type: integer
        description: Comma-separated event type IDs.
        explode: false
        style: form
      - in: query
        name: video_url
        schema:
          type: array
          items:
            type: string
        description: Comma-separated video URLs.
        explode: false
        style: form
      - in: query
        name: year
        schema:
          type: array
          items:
            type: number
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      tags:
      - Events
      security:
      - cookieAuth: []
      - Token_Authentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPolymorphicEventsEndpointList'
          description: ''
