openapi: 3.2.0
info:
  title: TheSpaceDevs LL2 Spacewalks API
  version: v2.3.0
  description: Rocket launches, space events and crewed spaceflight. The Launch Library 2 API is the official successor of the popular Launch Library API. It keeps its core features whilst also including everything the broader Space Launch Now API had to offer. The result is a large database delivering a more complete experience for each rocket launch and ...
  license:
    name: Apache License 2.0
servers:
- url: https://ll.thespacedevs.com/
  description: Production API (� rate-limited)
- url: https://lldev.thespacedevs.com/
  description: Development API (stale and limited data, for development testing only)
tags:
- name: Spacewalks
paths:
  /2.3.0/spacewalks/:
    get:
      operationId: spacewalks_list
      summary: List Spacewalks
      description: '#### Modes

        Levels of detail in the response - `list`, `normal`, `detailed`


        Example - /spacewalks/?mode=list


        #### Filters

        Parameters - `astronaut__ids`, `day`, `end`, `end__gt`, `end__gte`, `end__lt`, `end__lte`, `event__ids`, `id`, `ids`, `launch__ids`, `month`, `name`, `name__contains`, `owner__ids`, `program__ids`, `program__name`, `program__name__contains`, `spacestation__ids`, `start__gt`, `start__gte`, `start__lt`, `start__lte`, `year`


        Example - /spacewalks/?program__name=Apollo


        #### Search

        Fields searched - `crew__astronaut__name`, `location`, `name`, `program__name`


        Example - /spacewalks/?search=Hubble


        #### Ordering

        Fields - `duration`, `end`, `id`, `name`, `start`


        Example - /spacewalks/?ordering=-duration


        #### Number of results

        Use `limit` to control the number of objects in the response (max 100)


        Example - /spacewalks/?limit=2


        #### Format

        Switch to JSON output - /spacewalks/?format=json


        #### Help

        Find all the FAQs and support links on the documentation homepage - ll.thespacedevs.com/docs'
      parameters:
      - in: query
        name: astronaut__ids
        schema:
          type: array
          items:
            type: integer
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: day
        schema:
          type: array
          items:
            type: number
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: end
        schema:
          type: string
          format: date-time
      - in: query
        name: end__gt
        schema:
          type: string
          format: date-time
      - in: query
        name: end__gte
        schema:
          type: string
          format: date-time
      - in: query
        name: end__lt
        schema:
          type: string
          format: date-time
      - in: query
        name: end__lte
        schema:
          type: string
          format: date-time
      - in: query
        name: event__ids
        schema:
          type: array
          items:
            type: integer
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: id
        schema:
          type: integer
      - in: query
        name: ids
        schema:
          type: array
          items:
            type: integer
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: launch__ids
        schema:
          type: array
          items:
            type: string
            format: uuid
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: mode
        schema:
          type: string
          enum:
          - detailed
          - list
          - normal
        description: Level of detail in the response.
      - in: query
        name: month
        schema:
          type: array
          items:
            type: number
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: name
        schema:
          type: string
      - in: query
        name: name__contains
        schema:
          type: string
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: owner__ids
        schema:
          type: array
          items:
            type: number
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: program__ids
        schema:
          type: array
          items:
            type: integer
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: program__name
        schema:
          type: string
      - in: query
        name: program__name__contains
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: spacestation__ids
        schema:
          type: array
          items:
            type: integer
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: start__gt
        schema:
          type: string
          format: date-time
      - in: query
        name: start__gte
        schema:
          type: string
          format: date-time
      - in: query
        name: start__lt
        schema:
          type: string
          format: date-time
      - in: query
        name: start__lte
        schema:
          type: string
          format: date-time
      - in: query
        name: year
        schema:
          type: array
          items:
            type: number
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      tags:
      - Spacewalks
      security:
      - cookieAuth: []
      - Token_Authentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPolymorphicSpacewalkEndpointList'
          description: ''
  /2.3.0/spacewalks/{id}/:
    get:
      operationId: spacewalks_retrieve
      summary: Get Spacewalk
      description: '#### Modes

        Levels of detail in the response - `list`, `normal`, `detailed`


        Example - /spacewalks/?mode=list


        #### Filters

        Parameters - `astronaut__ids`, `day`, `end`, `end__gt`, `end__gte`, `end__lt`, `end__lte`, `event__ids`, `id`, `ids`, `launch__ids`, `month`, `name`, `name__contains`, `owner__ids`, `program__ids`, `program__name`, `program__name__contains`, `spacestation__ids`, `start__gt`, `start__gte`, `start__lt`, `start__lte`, `year`


        Example - /spacewalks/?program__name=Apollo


        #### Search

        Fields searched - `crew__astronaut__name`, `location`, `name`, `program__name`


        Example - /spacewalks/?search=Hubble


        #### Ordering

        Fields - `duration`, `end`, `id`, `name`, `start`


        Example - /spacewalks/?ordering=-duration


        #### Number of results

        Use `limit` to control the number of objects in the response (max 100)


        Example - /spacewalks/?limit=2


        #### Format

        Switch to JSON output - /spacewalks/?format=json


        #### Help

        Find all the FAQs and support links on the documentation homepage - ll.thespacedevs.com/docs'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Spacewalk.
        required: true
      tags:
      - Spacewalks
      security:
      - cookieAuth: []
      - Token_Authentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpacewalkEndpointDetailed'
          description: ''
