openapi: 3.2.0
info:
  title: TheSpaceDevs LL2 Payloads API
  version: v2.3.0
  description: Rocket launches, space events and crewed spaceflight. The Launch Library 2 API is the official successor of the popular Launch Library API. It keeps its core features whilst also including everything the broader Space Launch Now API had to offer. The result is a large database delivering a more complete experience for each rocket launch and ...
  license:
    name: Apache License 2.0
servers:
- url: https://ll.thespacedevs.com/
  description: Production API (� rate-limited)
- url: https://lldev.thespacedevs.com/
  description: Development API (stale and limited data, for development testing only)
tags:
- name: Payloads
paths:
  /2.3.0/payloads/:
    get:
      operationId: payloads_list
      summary: List Payloads
      description: '#### Modes

        Levels of detail in the response - `list`, `normal`, `detailed`


        Example - /payloads/?mode=list


        #### Filters

        Parameters - `manufacturer__id`, `manufacturer__name`, `name`, `operator`, `operator__id`, `operator__name`, `program__id`


        Example - /payloads/?program__id=18


        #### Search

        Fields searched - `manufacturer__name`, `name`, `operator__name`, `payloadflight__destination`, `payloadflight__rocket__launch__name`


        Example - /payloads/?search=EarthCare


        #### Ordering

        Fields - `id`, `name`, `payloadflight__rocket__launch__net`


        Example - /payloads/?ordering=-payloadflight__rocket__launch__net


        #### Number of results

        Use `limit` to control the number of objects in the response (max 100)


        Example - /payloads/?limit=2


        #### Format

        Switch to JSON output - /payloads/?format=json


        #### Help

        Find all the FAQs and support links on the documentation homepage - ll.thespacedevs.com/docs'
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: manufacturer__id
        schema:
          type: integer
      - in: query
        name: manufacturer__name
        schema:
          type: string
      - in: query
        name: mode
        schema:
          type: string
          enum:
          - detailed
          - list
          - normal
        description: Level of detail in the response.
      - in: query
        name: name
        schema:
          type: string
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: operator
        schema:
          type: integer
      - in: query
        name: operator__id
        schema:
          type: integer
      - in: query
        name: operator__name
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: program__id
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Payloads
      security:
      - cookieAuth: []
      - Token_Authentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPolymorphicPayloadEndpointList'
          description: ''
  /2.3.0/payloads/{id}/:
    get:
      operationId: payloads_retrieve
      summary: Get Payload
      description: '#### Modes

        Levels of detail in the response - `list`, `normal`, `detailed`


        Example - /payloads/?mode=list


        #### Filters

        Parameters - `manufacturer__id`, `manufacturer__name`, `name`, `operator`, `operator__id`, `operator__name`, `program__id`


        Example - /payloads/?program__id=18


        #### Search

        Fields searched - `manufacturer__name`, `name`, `operator__name`, `payloadflight__destination`, `payloadflight__rocket__launch__name`


        Example - /payloads/?search=EarthCare


        #### Ordering

        Fields - `id`, `name`, `payloadflight__rocket__launch__net`


        Example - /payloads/?ordering=-payloadflight__rocket__launch__net


        #### Number of results

        Use `limit` to control the number of objects in the response (max 100)


        Example - /payloads/?limit=2


        #### Format

        Switch to JSON output - /payloads/?format=json


        #### Help

        Find all the FAQs and support links on the documentation homepage - ll.thespacedevs.com/docs'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this payload.
        required: true
      tags:
      - Payloads
      security:
      - cookieAuth: []
      - Token_Authentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadDetailed'
          description: ''
components:
  schemas:
    ImageLicense:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        priority:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        link:
          type:
          - string
          - 'null'
          format: uri
          maxLength: 200
      required:
      - id
    ProgramMini:
      type: object
      properties:
        response_mode:
          type: string
          readOnly: true
          default: list
        id:
          type: integer
          readOnly: true
        url:
          type: string
          format: uri
          readOnly: true
        name:
          type: string
          maxLength: 255
        image:
          allOf:
          - $ref: '#/components/schemas/Image'
        info_url:
          type:
          - string
          - 'null'
          format: uri
          maxLength: 200
        wiki_url:
          type:
          - string
          - 'null'
          format: uri
          maxLength: 200
      required:
      - id
      - image
      - name
      - response_mode
      - url
    PolymorphicPayloadEndpoint:
      oneOf:
      - $ref: '#/components/schemas/PayloadMini'
      - $ref: '#/components/schemas/PayloadNormal'
      - $ref: '#/components/schemas/PayloadDetailed'
      discriminator:
        propertyName: response_mode
        mapping:
          list: '#/components/schemas/PayloadMini'
          normal: '#/components/schemas/PayloadNormal'
          detailed: '#/components/schemas/PayloadDetailed'
    AgencyMini:
      type: object
      properties:
        response_mode:
          type: string
          readOnly: true
          default: list
        id:
          type: integer
          readOnly: true
        url:
          type: string
          format: uri
          readOnly: true
        name:
          type: string
          maxLength: 200
        abbrev:
          type: string
          maxLength: 255
        type:
          $ref: '#/components/schemas/AgencyType'
      required:
      - id
      - name
      - response_mode
      - type
      - url
    Country:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        alpha_2_code:
          type: string
          description: ISO 3166-1 alpha-2
          maxLength: 2
        alpha_3_code:
          type: string
          description: ISO 3166-1 alpha-3
          maxLength: 3
        nationality_name:
          type: string
          description: e.g. French
          maxLength: 255
        nationality_name_composed:
          type: string
          description: e.g. Franco
          maxLength: 255
      required:
      - id
    ProgramType:
      type: object
      properties:
        id:
